name: Refresh contribution name graph

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate pixel assets from real GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python gen_pixel.py --user "${{ github.repository_owner }}" --name "PREETHS" --player "PREETHIKA"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then exit 0; fi
          # bump ?v= on image links so GitHub's image cache fetches the new files
          sed -i -E 's#(assets/[a-z-]+\.svg)(\?v=[0-9]+)?"#\1?v='"$(date +%Y%m%d%H%M)"'"#g' README.md
          git add README.md
          git commit -m "chore: refresh pixel profile assets"
          git push
